name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app and installers
        run: pnpm tauri build

      - name: Package portable ZIP and collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $conf = Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
          $appName = $conf.productName
          $version = $conf.version

          New-Item -ItemType Directory -Force -Path "release\portable" | Out-Null
          Copy-Item "target\release\${appName}.exe" "release\portable\${appName}_${version}.exe"
          if (Test-Path "target\release\binaries") {
            Copy-Item "target\release\binaries" "release\portable\binaries" -Recurse
          }

          $zipPath = "release\${appName}_${version}_windows-x64-portable.zip"
          Compress-Archive -Path "release\portable\*" -DestinationPath $zipPath -Force
          Remove-Item "release\portable" -Recurse -Force

          Get-ChildItem "target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination "release\"
          Get-ChildItem "target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination "release\"

          Get-ChildItem "release\"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
